name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace || (echo "Retrying Gradle assemble..." && gradle assembleDebug --no-daemon --stacktrace)

      - name: Prepare Clean Release Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/ChatNotes.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatNotes-APK
          path: release-assets/ChatNotes.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/ChatNotes.apk
          name: ChatNotes ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ### 📝 ChatNotes ${{ github.ref_name }}

            A private, floating scratchpad that automatically appears when you open WhatsApp chats.

            #### ✨ Features:
            - **Unique Per Contact**: Independent checklists and notes for each person you chat with.
            - **Interactive Checklist**: Cross off talking points while messaging.
            - **Freeform Notes**: Store memos, addresses, and details.
            - **Undo Checklist Deletion**: Instant 4-second undo banner when removing items or clearing all.
            - **Smart Starred Notes**: Automatic mini-pill blooms once per chat without re-triggering.
            - **Direct WhatsApp Insertion**: One-tap insert directly into WhatsApp's message box.
            - **100% Offline & Private**: Zero data leaves your device.

            #### 📥 Quick Installation:
            1. Tap **`ChatNotes.apk`** below to download and install on your Android device.
            2. Open the app and turn ON the two permissions (**Appear on Top** & **Accessibility Service**).
            3. Open any WhatsApp conversation and your floating notes pill will appear!
          draft: false
          prerelease: false
